name: test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The ordinary gate: everything except the exhaustive publication-recovery sweeps, which run
  # beside it in `recovery-test`. Split for headroom rather than coverage — nothing is sampled, and
  # `npm test` still runs the whole suite locally.
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Install Beads native binary
        run: CI= node node_modules/@beads/bd/scripts/postinstall.js
      - run: npm run test:fast
      - run: npm run demo
      - name: Verify provider-independent Beads bootstrap
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum AGENTS.md)"
          npm run beads:init
          after="$(sha256sum AGENTS.md)"
          test "$before" = "$after"
          npx bd version
          npm run beads:prime >/dev/null
          npm run beads:ready >/dev/null

  # Every write, both lanes, pre-commit and commit-then-lost-ack. These sweeps grow with each new
  # protocol, so they get their own budget: a protocol added later lengthens this job rather than
  # pushing the general gate toward its timeout.
  recovery-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run test:recovery

  lagrange-backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: psvensson/lagrange
          ref: cd6f6d5251cc41d1a49d928c36ed6727037f5deb
          path: .integration/lagrange
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm ci --omit=dev
        working-directory: .integration/lagrange
      - name: Link the public Lagrange package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node_modules
          ln -s ../.integration/lagrange node_modules/lagrange-server
      - name: Prove schema and atomic transactions against real Lagrange
        run: node --test test/lagrange-backend-real.test.js
        env:
          LAGRANGE_IMAGES_REAL_LAGRANGE: '1'

  opensmalltalk-cuis-integration:
    runs-on: ubuntu-latest
    # 20 min: the semantic-export tests add three full 6-package cluster builds (structural +
    # two determinism builds) on top of the existing cluster build, and a cold runner must first
    # download the pinned OpenSmalltalkVM + Cuis image. (The recovery-test lane already uses 20.)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Download pinned OpenSmalltalkVM, Cuis image and JSON package
        run: scripts/integration-setup.sh
      - name: Run real OpenSmalltalkVM + Cuis runtime and toolchain proofs
        shell: bash
        run: |
          set -euo pipefail
          npm run test:integration
