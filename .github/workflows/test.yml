name: test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run demo

  opensmalltalk-cuis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Download pinned OpenSmalltalkVM, Cuis image and JSON package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .integration/opensmalltalk-vm .integration/cuis

          curl --fail --location --retry 3 \
            --output .integration/opensmalltalk-vm/vm.tar.gz \
            https://github.com/OpenSmalltalk/opensmalltalk-vm/releases/download/202606270913/squeak.cog.spur_linux64x64.tar.gz
          echo 'dff5dd4217820e971828e9459f235d0ab3a07aa02aea9004d0e4318391eb09ba  .integration/opensmalltalk-vm/vm.tar.gz' | sha256sum --check --strict
          tar -xzf .integration/opensmalltalk-vm/vm.tar.gz -C .integration/opensmalltalk-vm

          CUIS_COMMIT=6bcee3f38ce037c9714b997ccd3b5b3ff62965c8
          CUIS_ROOT="https://raw.githubusercontent.com/Cuis-Smalltalk/Cuis-Smalltalk-Dev/$CUIS_COMMIT"
          CUIS_IMAGE_ROOT="$CUIS_ROOT/CuisImage"
          curl --fail --location --retry 3 \
            --output .integration/cuis/Cuis7.9-8090.image \
            "$CUIS_IMAGE_ROOT/Cuis7.9-8090.image"
          test "$(git hash-object .integration/cuis/Cuis7.9-8090.image)" = '523dc5e74b5b550922b56ff2406415c19700ee8e'

          curl --fail --location --retry 3 \
            --output .integration/cuis/Cuis7.9-8090.changes \
            "$CUIS_IMAGE_ROOT/Cuis7.9-8090.changes"
          curl --fail --location --retry 3 \
            --output .integration/cuis/Cuis7.8.sources \
            "$CUIS_IMAGE_ROOT/Cuis7.8.sources"

          curl --fail --location --retry 3 \
            --output .integration/cuis/JSON.pck.st \
            "$CUIS_ROOT/Packages/Features/JSON.pck.st"
          test "$(git hash-object .integration/cuis/JSON.pck.st)" = '47fab65d0d9017d706aa07d39ab0451619488ccd'

          VM_PATH="$(find .integration/opensmalltalk-vm -type f -name squeak -perm -111 -print -quit)"
          if [ -z "$VM_PATH" ]; then
            echo 'Could not find executable squeak in pinned OpenSmalltalkVM archive' >&2
            find .integration/opensmalltalk-vm -maxdepth 4 -type f -print >&2
            exit 1
          fi
          printf '%s\n' "$VM_PATH" > .integration/opensmalltalk-vm/path
      - name: Run real OpenSmalltalkVM + Cuis runtime and toolchain proofs
        shell: bash
        run: |
          set -euo pipefail
          export LAGRANGE_OPENSMALLTALK_INTEGRATION=1
          export LAGRANGE_OPENSMALLTALK_VM_PATH="$(cat .integration/opensmalltalk-vm/path)"
          export LAGRANGE_CUIS_IMAGE_PATH="$PWD/.integration/cuis/Cuis7.9-8090.image"
          export LAGRANGE_CUIS_CHANGES_PATH="$PWD/.integration/cuis/Cuis7.9-8090.changes"
          export LAGRANGE_CUIS_SOURCES_PATH="$PWD/.integration/cuis/Cuis7.8.sources"
          export LAGRANGE_CUIS_JSON_PACKAGE_PATH="$PWD/.integration/cuis/JSON.pck.st"
          node --test \
            test/opensmalltalk-cuis-real.test.js \
            test/opensmalltalk-cuis-toolchain-real.test.js
