name: test

on:
  pull_request:
    branches: [main]

concurrency:
  group: test-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # The ordinary gate: everything except the exhaustive publication-recovery sweeps, which run
  # beside it in `recovery-test`. Split for headroom rather than coverage — nothing is sampled, and
  # `npm test` still runs the whole suite locally.
  node-test:
    runs-on: ubuntu-latest
    # Native protocol makes every standard-image fixture do more real work. M4 run34698454936
    # emitted 1501 passing tests, still progressing, before the 20-minute job limit cancelled it.
    # Keep all assertions and a finite hang detector; only the ordinary lane needs this budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Install Beads native binary
        run: CI= node node_modules/@beads/bd/scripts/postinstall.js
      - name: Resolve prior native proof
        id: proof
        run: node scripts/ci-proof.mjs decide node-test
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run test:fast
        if: steps.proof.outputs.reuse != 'true'
      - name: Verify current documentation and real-test module loading
        if: steps.proof.outputs.reuse == 'true'
        run: node scripts/ci-proof.mjs check node-test
      - run: npm run demo
      - name: Record successful native tests before the mutable Beads bootstrap
        run: node scripts/ci-proof.mjs publish node-test
      - name: Verify provider-independent Beads bootstrap
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum AGENTS.md)"
          npm run beads:init
          after="$(sha256sum AGENTS.md)"
          test "$before" = "$after"
          npx bd version
          npm run beads:prime >/dev/null
          npm run beads:ready >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: ci-proof-node-test
          path: ${{ runner.temp }}/ci-proof/node-test/proof.json
          if-no-files-found: error
          overwrite: true

  # Every write, both lanes, pre-commit and commit-then-lost-ack. These sweeps grow with each new
  # protocol, so they get their own budget: a protocol added later lengthens this job rather than
  # pushing the general gate toward its timeout.
  recovery-test:
    runs-on: ubuntu-latest
    # The M4 digitValue head exceeded 20m while exhaustive proofs were still progressing.
    # Keep every write/failure mode/lane; retain a finite limit for a stalled run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Resolve prior recovery proof
        id: proof
        run: node scripts/ci-proof.mjs decide recovery-test
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run test:recovery
        if: steps.proof.outputs.reuse != 'true'
      - name: Verify current real-test module loading in the recovery lane
        if: steps.proof.outputs.reuse == 'true'
        run: node scripts/ci-proof.mjs check recovery-test
      - name: Publish successful recovery proof
        run: node scripts/ci-proof.mjs publish recovery-test
      - uses: actions/upload-artifact@v7
        with:
          name: ci-proof-recovery-test
          path: ${{ runner.temp }}/ci-proof/recovery-test/proof.json
          if-no-files-found: error
          overwrite: true

  lagrange-backend-integration:
    runs-on: ubuntu-latest
    # The proof itself runs in ~30s; the npm ci / public-package link setup varies 5-15 minutes on
    # hosted runners and hit the old 15-minute limit with the test already green (PR #195).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: psvensson/lagrange
          ref: cd6f6d5251cc41d1a49d928c36ed6727037f5deb
          path: .integration/lagrange
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm ci --omit=dev
        working-directory: .integration/lagrange
      - name: Link the public Lagrange package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node_modules
          ln -s ../.integration/lagrange node_modules/lagrange-server
      - name: Prove schema and atomic transactions against real Lagrange
        run: node --test test/lagrange-backend-real.test.js
        env:
          LAGRANGE_IMAGES_REAL_LAGRANGE: '1'

  # The Cargo/rustc OCI boundary's only real proof (ADR 0077). Everything else about that provider
  # is tested through a fake runner, so without this job nothing in CI shows that a real compiler
  # accepts the graph the provider materializes, or that what comes back executes.
  cargo-rustc-oci-integration:
    runs-on: ubuntu-latest
    # 15 min: a cold runner pulls the pinned toolchain image (~330 MB) before the first build; the
    # builds themselves are seconds, and the pull retries a rate-limited registry up to three times.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Pull the pinned Cargo/rustc toolchain image
        run: scripts/cargo-oci-setup.sh
      - name: Compile and execute a closed Rust graph through real Cargo/rustc
        run: npm run test:cargo-oci

  common-lisp-integration:
    runs-on: ubuntu-latest
    # The language-neutrality falsifier (ADR 0084): a real SBCL from the distribution package,
    # executed through the generic foreign-runtime contracts. The identity the test records is
    # `sbcl/<version>` as reported by the installed binary.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl && sbcl --version
      - name: Execute Common Lisp through the generic foreign-runtime path
        run: npm run test:common-lisp

  opensmalltalk-cuis-integration:
    runs-on: ubuntu-latest
    # 20 min: the semantic-export tests add three full 6-package cluster builds (structural +
    # two determinism builds) on top of the existing cluster build, and a cold runner must first
    # download the pinned OpenSmalltalkVM + Cuis image. (The recovery-test lane already uses 20.)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Download pinned OpenSmalltalkVM, Cuis image and JSON package
        run: scripts/integration-setup.sh
      - name: Run real OpenSmalltalkVM + Cuis runtime and toolchain proofs
        shell: bash
        run: |
          set -euo pipefail
          npm run test:integration
